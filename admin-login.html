<head>

    <script>try{if(localStorage.getItem('edu_admin_theme')==='dark')document.documentElement.setAttribute('data-theme','dark');}catch(e){}</script>
    <link rel="stylesheet" href="admin.css?v=20261010q">
<meta name="theme-color" content="#4318FF">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">

</head>
<body class="login-body">
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false"><defs><symbol id="logo" viewBox="0 0 120 126"><defs><linearGradient id="efP" gradientUnits="userSpaceOnUse" x1="10" y1="4" x2="100" y2="120"><stop offset="0" stop-color="#5B3DFF"/><stop offset="1" stop-color="#2B1C9E"/></linearGradient><linearGradient id="efG" gradientUnits="userSpaceOnUse" x1="60" y1="70" x2="100" y2="124"><stop offset="0" stop-color="#2EE0B0"/><stop offset="1" stop-color="#05A67A"/></linearGradient></defs><path d="M8 23 56 5l48 18-48 15Z" fill="url(#efP)" stroke="url(#efP)" stroke-width="4" stroke-linejoin="round"/><path d="M13 26v24" stroke="#3A22D6" stroke-width="2.4" stroke-linecap="round" fill="none"/><rect x="9.5" y="49" width="7" height="12" rx="2.6" fill="#2B1C9E"/><g transform="translate(0 6)"><path d="M42 40H86A6 6 0 0 1 92 46V50A6 6 0 0 1 86 56H38V67H76A5 5 0 0 1 81 72V76A5 5 0 0 1 76 81H38V94H50A5 5 0 0 1 55 99V105A5 5 0 0 1 50 110H42A22 22 0 0 1 20 88V62A22 22 0 0 1 42 40Z" fill="url(#efP)" stroke="url(#efP)" stroke-width="1.6" stroke-linejoin="round"/><rect x="60" y="94" width="10" height="16" rx="2.4" fill="url(#efG)"/><rect x="73" y="87" width="10" height="23" rx="2.4" fill="url(#efG)"/><rect x="86" y="78" width="10" height="32" rx="2.4" fill="url(#efG)"/><path d="M52 116C82 116 104 102 104 68" fill="none" stroke="url(#efG)" stroke-width="4.6" stroke-linecap="round"/><path d="M104 56 96.5 69h15z" fill="url(#efG)" stroke="url(#efG)" stroke-width="2" stroke-linejoin="round"/></g></symbol></defs></svg>
    <button type="button" class="icon-btn theme-fab" id="themeToggle" aria-label="Switch theme"><i class="fa-solid fa-moon"></i></button>
    <main class="login-card">
        <div class="login-brand">
            <div class="sb-logo"><svg class="logo-mark" viewBox="0 0 120 126" aria-hidden="true" focusable="false"><use href="#logo"/></svg></div>
            <div>
                <h1>Admin Login</h1>
                <p class="muted">EduFinance staff only</p>
            </div>
        </div>

        <form id="adminLoginForm" class="login-form" novalidate>
            <div class="login-error" id="loginError" role="alert" hidden></div>
            <div class="field">
                <label for="adminEmailInput">Email</label>
                <input type="email" id="adminEmailInput" autocomplete="username" required>
            </div>
            <div class="field">
                <label for="adminPassInput">Password</label>
                <div class="pw-wrap">
                    <input type="password" id="adminPassInput" autocomplete="current-password" required>
                    <button type="button" class="pw-toggle" id="pwToggle" aria-label="Show password"><i class="fa-solid fa-eye"></i></button>
                </div>
            </div>
            <button type="submit" class="btn btn-primary btn-block" id="loginBtn">Sign in</button>
        </form>

        <p class="login-foot muted">Admin accounts are created by the site owner. There is no sign-up.</p>
    </main>

    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
    <script src="admin-login.js?v=20261010a"></script>
<script src="admin-theme.js?v=20261010a"></script>
</body>
</html>
