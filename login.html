<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login / Signup - EduFinance</title>
    <!-- Google Fonts: Plus Jakarta Sans & Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Custom Style Sheet -->
    <link rel="stylesheet" href="style.css">
    <!-- Firebase Compat SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
    <style>
        :root {
            --bg-app: #F8FAFC;
            --bg-card: #FFFFFF;
            --text-main: #0F172A;
            --text-muted: #64748B;
            --border-color: #E2E8F0;
            --primary: #2563EB;
            --primary-hover: #1D4ED8;
            --success: #059669;
            --danger: #DC2626;
            --warning: #D97706;
            --border-radius: 20px;
            --box-shadow: 0 20px 40px -15px rgba(15, 23, 42, 0.08);
            --transition: all 0.25s ease;
        }

        body.auth-body {
            background-color: var(--bg-app);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
            font-family: 'Plus Jakarta Sans', 'Inter', sans-serif;
            color: var(--text-main);
        }

        .auth-wrapper { width: 100%; max-width: 440px; margin: 24px auto; }

        .auth-card {
            background: var(--bg-card);
            border-radius: var(--border-radius);
            padding: 40px 36px 36px;
            box-shadow: var(--box-shadow);
            border: 1px solid var(--border-color);
        }
        .auth-card.hidden { display: none !important; }

        /* Brand + title */
        .logo-header {
            display: flex; align-items: center; justify-content: center;
            gap: 8px; text-decoration: none; margin-bottom: 28px;
        }
        .logo-icon { font-size: 1.35rem; color: var(--primary); }
        .logo-text { font-size: 1.1rem; font-weight: 700; color: var(--text-main); }

        .auth-title {
            font-size: 1.65rem; font-weight: 800; letter-spacing: -0.02em;
            text-align: center; color: var(--text-main); margin: 0 0 28px;
        }
        .auth-sub { text-align: center; color: var(--text-muted); font-size: 0.95rem; line-height: 1.6; margin: -14px 0 28px; }
        .auth-sub strong { color: var(--text-main); font-weight: 600; word-break: break-all; }

        /* Google button */
        .google-auth-btn {
            width: 100%; background: #FFFFFF; border: 1px solid var(--border-color);
            border-radius: 12px; padding: 13px; display: flex; align-items: center;
            justify-content: center; gap: 10px; cursor: pointer; color: var(--text-main);
            font-weight: 600; font-size: 0.95rem; transition: var(--transition);
            box-shadow: 0 1px 2px rgba(0,0,0,0.04); font-family: inherit;
        }
        .google-auth-btn:hover { background: #F8FAFC; border-color: #CBD5E1; }

        .divider {
            display: flex; align-items: center; color: var(--text-muted);
            font-size: 0.8rem; margin: 24px 0; text-transform: lowercase;
        }
        .divider::before, .divider::after { content: ''; flex: 1; border-bottom: 1px solid var(--border-color); }
        .divider::before { margin-right: 14px; }
        .divider::after { margin-left: 14px; }

        /* Progress */
        .wizard-steps {
            display: flex; justify-content: space-between; align-items: center;
            margin: 0 0 28px; position: relative;
        }
        .wizard-steps::before {
            content: ''; position: absolute; top: 50%; left: 16px; right: 16px;
            height: 2px; background: var(--border-color); transform: translateY(-50%); z-index: 1;
        }
        .wizard-step {
            width: 32px; height: 32px; border-radius: 50%; background: var(--bg-card);
            border: 2px solid var(--border-color); color: var(--text-muted);
            display: flex; align-items: center; justify-content: center;
            font-weight: 700; font-size: 0.85rem; position: relative; z-index: 2; transition: var(--transition);
        }
        .wizard-step.active { background: var(--primary); border-color: var(--primary); color: #FFF; }
        .wizard-step.completed { background: var(--success); border-color: var(--success); color: #FFF; }

        /* Form */
        .form { display: flex; flex-direction: column; gap: 20px; }
        .form-group { display: flex; flex-direction: column; gap: 8px; }
        .form-group label { font-size: 0.88rem; font-weight: 600; color: var(--text-main); }
        .form-hint { font-size: 0.78rem; color: var(--text-muted); }

        .form-control {
            background: #F8FAFC; border: 1px solid var(--border-color);
            padding: 13px 16px; border-radius: 12px; color: var(--text-main);
            font-size: 0.95rem; outline: none; transition: var(--transition); font-family: inherit; width: 100%;
        }
        .form-control:focus { border-color: var(--primary); background: #FFF; box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12); }
        .form-group-row { display: flex; gap: 14px; }
        .flex-1 { flex: 1; min-width: 0; }

        /* Buttons */
        .btn {
            padding: 13px 20px; border-radius: 12px; font-weight: 600; font-size: 0.95rem;
            cursor: pointer; border: none; display: inline-flex; align-items: center;
            justify-content: center; gap: 10px; transition: var(--transition);
            text-decoration: none; font-family: inherit;
        }
        .btn:disabled { opacity: 0.6; cursor: not-allowed; }
        .btn-full { width: 100%; }
        .btn-primary { background-color: var(--primary); color: #FFFFFF; }
        .btn-primary:hover:not(:disabled) { background-color: var(--primary-hover); }
        .btn-outline { background: #FFFFFF; border: 1px solid var(--border-color); color: var(--text-main); }
        .btn-outline:hover:not(:disabled) { background: #F8FAFC; border-color: #CBD5E1; }
        .btn-row { display: flex; gap: 12px; margin-top: 4px; }

        .wizard-pane { display: none; }
        .wizard-pane.active { display: flex; flex-direction: column; gap: 20px; }

        .username-status { font-size: 0.78rem; font-weight: 600; display: flex; align-items: center; gap: 5px; }
        .username-status.available { color: var(--success); }
        .username-status.checking { color: var(--warning); }
        .username-status.taken { color: var(--danger); }

        .switch-line { text-align: center; margin-top: 28px; font-size: 0.9rem; color: var(--text-muted); }
        .switch-line a, .link-btn { color: var(--primary); text-decoration: none; font-weight: 600; background: none; border: 0; padding: 0; font: inherit; font-weight: 600; cursor: pointer; }

        /* Verify screen */
        .verify-icon {
            width: 68px; height: 68px; border-radius: 20px; background: #EFF6FF; color: var(--primary);
            display: flex; align-items: center; justify-content: center; font-size: 1.7rem; margin: 0 auto 20px;
        }
        .verify-actions { display: flex; flex-direction: column; gap: 12px; }

        @media (max-width: 480px) {
            body.auth-body { padding: 14px; align-items: flex-start; }
            .auth-card { padding: 32px 22px 28px; }
            .auth-title { font-size: 1.5rem; }
        }
    </style>
</head>
<body class="auth-body">
    <div class="auth-wrapper">

        <!-- ================= LOGIN ================= -->
        <div id="login-section" class="auth-card">
            <a href="index.html" class="logo-header">
                <i class="fa-solid fa-graduation-cap logo-icon"></i>
                <span class="logo-text">EduFinance</span>
            </a>
            <h1 class="auth-title">Welcome back</h1>

            <button type="button" class="google-auth-btn" id="googleLoginBtn">
                <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true">
                    <path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.66-5.17 3.66-9.17z"/>
                    <path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.11-6.72-4.95H1.14v3.15C3.15 21.32 7.21 24 12 24z"/>
                    <path fill="#FBBC05" d="M5.28 14.25c-.25-.72-.38-1.49-.38-2.25s.13-1.53.38-2.25V6.6H1.14C.41 8.08 0 9.75 0 12s.41 3.92 1.14 5.4l4.14-3.15z"/>
                    <path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.21 0 3.15 2.68 1.14 6.6l4.14 3.15c.95-2.84 3.6-4.95 6.72-4.95z"/>
                </svg>
                Continue with Google
            </button>

            <div class="divider">or</div>

            <form id="loginForm" class="form">
                <div class="form-group">
                    <label for="loginEmail">Email</label>
                    <input type="email" id="loginEmail" class="form-control" placeholder="john@university.edu" autocomplete="email" required>
                </div>
                <div class="form-group">
                    <label for="loginPassword">Password</label>
                    <input type="password" id="loginPassword" class="form-control" placeholder="••••••••" autocomplete="current-password" required minlength="6">
                </div>
                <button type="submit" class="btn btn-primary btn-full" id="loginSubmitBtn">Log in</button>
            </form>

            <p class="switch-line">New here? <a href="#" id="showSignupBtn">Create an account</a></p>
        </div>

        <!-- ================= SIGNUP (3 steps) ================= -->
        <div id="signup-section" class="auth-card hidden">
            <a href="index.html" class="logo-header">
                <i class="fa-solid fa-graduation-cap logo-icon"></i>
                <span class="logo-text">EduFinance</span>
            </a>
            <h1 class="auth-title">Create your account</h1>

            <div class="wizard-steps">
                <div class="wizard-step active" id="wStep1">1</div>
                <div class="wizard-step" id="wStep2">2</div>
                <div class="wizard-step" id="wStep3">3</div>
            </div>

            <form id="signupForm" class="form" novalidate>
                <!-- Step 1 -->
                <div class="wizard-pane active" id="paneStep1">
                    <button type="button" class="google-auth-btn" id="googleSignupBtn">
                        <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true">
                    <path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.66-5.17 3.66-9.17z"/>
                    <path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.11-6.72-4.95H1.14v3.15C3.15 21.32 7.21 24 12 24z"/>
                    <path fill="#FBBC05" d="M5.28 14.25c-.25-.72-.38-1.49-.38-2.25s.13-1.53.38-2.25V6.6H1.14C.41 8.08 0 9.75 0 12s.41 3.92 1.14 5.4l4.14-3.15z"/>
                    <path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.21 0 3.15 2.68 1.14 6.6l4.14 3.15c.95-2.84 3.6-4.95 6.72-4.95z"/>
                </svg>
                        Sign up with Google
                    </button>
                    <div class="divider" style="margin: 4px 0;">or</div>
                    <div class="form-group">
                        <label for="signupEmail">Email</label>
                        <input type="email" id="signupEmail" class="form-control" placeholder="john@university.edu" autocomplete="email">
                    </div>
                    <div class="form-group">
                        <label for="signupPassword">Password</label>
                        <input type="password" id="signupPassword" class="form-control" placeholder="At least 6 characters" autocomplete="new-password" minlength="6">
                    </div>
                    <button type="button" class="btn btn-primary btn-full" id="nextToStep2">Continue</button>
                </div>

                <!-- Step 2 -->
                <div class="wizard-pane" id="paneStep2">
                    <div class="form-group-row">
                        <div class="form-group flex-1">
                            <label for="signupFirstName">First name</label>
                            <input type="text" id="signupFirstName" class="form-control" placeholder="John" autocomplete="given-name">
                        </div>
                        <div class="form-group flex-1">
                            <label for="signupLastName">Last name</label>
                            <input type="text" id="signupLastName" class="form-control" placeholder="Doe" autocomplete="family-name">
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="signupUsername">Username</label>
                        <input type="text" id="signupUsername" class="form-control" placeholder="johndoe99" autocomplete="username">
                        <div id="usernameStatus" class="username-status" style="display: none;"></div>
                    </div>
                    <div class="form-group">
                        <label for="signupDob">Date of birth</label>
                        <input type="date" id="signupDob" class="form-control">
                        <span class="form-hint">You must be 13 or older.</span>
                    </div>
                    <div class="btn-row">
                        <button type="button" class="btn btn-outline flex-1" id="backToStep1">Back</button>
                        <button type="button" class="btn btn-primary flex-1" id="nextToStep3">Continue</button>
                    </div>
                </div>

                <!-- Step 3 -->
                <div class="wizard-pane" id="paneStep3">
                    <div class="form-group">
                        <label for="signupCurrency">Currency</label>
                        <select id="signupCurrency" class="form-control"></select>
                    </div>
                    <div class="btn-row">
                        <button type="button" class="btn btn-outline flex-1" id="backToStep2">Back</button>
                        <button type="submit" class="btn btn-primary flex-1" id="signupSubmitBtn">Create account</button>
                    </div>
                </div>
            </form>

            <p class="switch-line">Already have an account? <a href="#" id="showLoginBtn">Log in</a></p>
        </div>

        <!-- ================= VERIFY EMAIL ================= -->
        <div id="verify-section" class="auth-card hidden">
            <a href="index.html" class="logo-header">
                <i class="fa-solid fa-graduation-cap logo-icon"></i>
                <span class="logo-text">EduFinance</span>
            </a>
            <div class="verify-icon"><i class="fa-solid fa-envelope-circle-check"></i></div>
            <h1 class="auth-title" style="margin-bottom: 16px;">Verify your email</h1>
            <p class="auth-sub" style="margin-top: 0;">We sent a link to <strong id="verifyEmail"></strong></p>

            <div class="verify-actions">
                <button type="button" class="btn btn-primary btn-full" id="verifyDoneBtn">I've verified my email</button>
                <button type="button" class="btn btn-outline btn-full" id="resendBtn">Resend email</button>
            </div>
            <p class="switch-line"><button type="button" class="link-btn" id="verifyBackBtn">Use a different email</button></p>
        </div>

    </div>

    <!-- Google profile completion -->
    <div class="modal-backdrop" id="googleInfoModal">
        <div class="modal" style="max-width: 420px;">
            <div class="modal-header">
                <h3>Almost done</h3>
            </div>
            <div class="modal-body">
                <form id="googleInfoForm" class="form">
                    <div class="form-group-row">
                        <div class="form-group flex-1">
                            <label for="googleFirstName">First name</label>
                            <input type="text" id="googleFirstName" class="form-control" placeholder="John" required>
                        </div>
                        <div class="form-group flex-1">
                            <label for="googleLastName">Last name</label>
                            <input type="text" id="googleLastName" class="form-control" placeholder="Doe">
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="googleUsername">Username</label>
                        <input type="text" id="googleUsername" class="form-control" required placeholder="johndoe99">
                    </div>
                    <div class="form-group">
                        <label for="googleDob">Date of birth</label>
                        <input type="date" id="googleDob" class="form-control" required>
                        <span class="form-hint">You must be 13 or older.</span>
                    </div>
                    <div class="form-group">
                        <label for="googleCurrency">Currency</label>
                        <select id="googleCurrency" class="form-control"></select>
                    </div>
                    <div class="modal-footer" style="margin-top: 8px;">
                        <button type="submit" class="btn btn-primary btn-full">Create account</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Toast -->
    <div id="toastNotification" class="toast">
        <span class="toast-icon" id="toastIcon"><i class="fa-solid fa-circle-info"></i></span>
        <span class="toast-message" id="toastMessage">Message here...</span>
    </div>

    <script src="currency.js"></script>
    <script src="auth.js"></script>
</body>
</html>
