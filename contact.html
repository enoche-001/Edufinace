<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - EduFinance</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="landing-auth-wrapper">
        <header class="landing-header">
            <div class="logo">
                <i class="fa-solid fa-graduation-cap logo-icon"></i>
                <a href="index.html" style="text-decoration: none; color: inherit;"><span>EduFinance</span></a>
            </div>
            <div class="landing-nav-actions">
                <a href="login.html" class="btn btn-secondary-outline btn-small">Login</a>
                <a href="login.html" class="btn btn-primary btn-small">Get Started</a>
            </div>
        </header>

        <main style="flex: 1; max-width: 700px; margin: 40px auto; padding: 0 20px;">
            <div class="card">
                <h1 style="font-size: 2rem; font-weight: 800; margin-bottom: 10px;">Contact Us</h1>
                <p class="text-muted" style="margin-bottom: 25px;">Have questions or feedback? Reach out to our support team.</p>
                
                <form id="contactForm" class="form">
                    <div class="form-group">
                        <label for="contactName">Your Name</label>
                        <input type="text" id="contactName" class="form-control" placeholder="Alex Student" required>
                    </div>
                    <div class="form-group">
                        <label for="contactEmail">Email Address</label>
                        <input type="email" id="contactEmail" class="form-control" placeholder="student@university.edu" required>
                    </div>
                    <div class="form-group">
                        <label for="contactSubject">Subject</label>
                        <input type="text" id="contactSubject" class="form-control" placeholder="What is this about?" maxlength="120" required>
                    </div>
                    <div class="form-group">
                        <label for="contactMsg">Message</label>
                        <textarea id="contactMsg" class="form-control" rows="5" maxlength="2000" placeholder="How can we help you?" required style="resize: vertical;"></textarea>
                    </div>
                    <button type="submit" class="btn btn-primary btn-full">
                        <i class="fa-solid fa-paper-plane"></i> Send Message
                    </button>
                </form>
            </div>
        </main>

        <footer style="background: var(--bg-sidebar); border-top: 1px solid var(--border-color); padding: 30px; text-align: center;">
            <p class="text-muted" style="font-size: 0.85rem;">&copy; 2026 EduFinance. <a href="index.html" class="text-primary">Home</a></p>
        </footer>
    </div>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
    <script src="public-forms.js"></script>
</body>
</html>
